name: Generate YouTube Video (iPhone)
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Text for your video'
        required: true
        type: string
      language:
        description: 'Voice language'
        type: choice
        options: [de-DE, en-US]
        default: de-DE
      orientation:
        description: 'Video orientation'
        type: choice
        options: [portrait, landscape]
        default: portrait
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TTS_PROVIDER: edge-tts
      OPENVERSE_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install edge-tts
          npm ci
      - name: Set script
        env:
          VIDEO_SCRIPT: ${{ inputs.script }}
          VIDEO_LANGUAGE: ${{ inputs.language }}
          VIDEO_ORIENTATION: ${{ inputs.orientation }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const script = process.env.VIDEO_SCRIPT?.trim();
          if (!script) throw new Error('Script is empty');
          fs.mkdirSync('input/scripts', {recursive:true});
          fs.writeFileSync('input/scripts/input-scripts.json', JSON.stringify([{
            id: 'iphone-video',
            title: 'YouTube Video',
            script,
            orientation: process.env.VIDEO_ORIENTATION,
            language: process.env.VIDEO_LANGUAGE === 'de-DE' ? 'german' : 'english',
            voice: process.env.VIDEO_LANGUAGE === 'de-DE' ? 'de-DE-ConradNeural' : 'en-US-GuyNeural',
            showText: true
          }], null, 2));
          NODE
      - name: Render video
        shell: bash
        run: |
          set -o pipefail
          npm run generate 2>&1 | tee video-render.log
      - name: Reject missing visual media
        shell: bash
        run: |
          if grep -Eiq 'FALLBACK.*(visual|image|video)|\[(VISUAL|MEDIA)\].*FALLBACK|using fallback (video|visual|background)' video-render.log; then
            echo "::error::Visual media fallback detected. Refusing text-only video."
            exit 1
          fi
      - name: Collect rendered MP4
        run: |
          mkdir -p downloadable-video
          python - <<'PY'
          from pathlib import Path
          import shutil
          excluded = ('node_modules', '.git', 'downloadable-video')
          files = [p for p in Path('.').rglob('*.mp4') if not any(part in excluded for part in p.parts) and p.stat().st_size > 10000]
          print('MP4 candidates:', [(str(p), p.stat().st_size) for p in files])
          if not files:
              raise SystemExit('No MP4 produced. Inspect Render video logs.')
          selected = max(files, key=lambda p: p.stat().st_mtime)
          shutil.copy2(selected, 'downloadable-video/youtube-video.mp4')
          print('Downloadable MP4:', selected)
          PY
      - name: Save rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video
          path: downloadable-video/youtube-video.mp4
          if-no-files-found: error
          retention-days: 7
